{{- $p := .Values.postgres -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "gpucp-db.secretName" . }}
  labels:
    {{- include "gpucp-db.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_DB: {{ $p.database | quote }}
  POSTGRES_USER: {{ $p.user | quote }}
  POSTGRES_PASSWORD: {{ $p.password | quote }}
  # Consumed by the migrate Job now and by apiserver/controller in S2-14.
  DATABASE_URL: {{ printf "postgres://%s:%s@postgres.%s.svc.cluster.local:5432/%s?sslmode=disable" ($p.user | urlquery) ($p.password | urlquery) .Release.Namespace $p.database | quote }}
